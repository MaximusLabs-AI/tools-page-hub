# =====================================================
# Wrangler config for the MaximusLabs Tools reverse-proxy Worker.
#
# What this file is for: Wrangler is Cloudflare's CLI for deploying Workers.
# Without this file, cloudflare-worker-tools.js is just a script sitting in
# the repo — nothing runs it. This file tells Cloudflare which script to
# deploy, what to call it, which URL patterns should trigger it (the
# "routes"), and what config values it needs. Run `wrangler deploy` (after
# `wrangler login`) and the Worker goes live with these exact settings —
# no manual copy-pasting into the dashboard.
#
# Fill in the one placeholder below before deploying:
#   - account_id  -> Cloudflare dashboard, right sidebar of any zone overview
# =====================================================

name = "maximus-tools-proxy"
main = "cloudflare-worker-tools.js"
compatibility_date = "2024-09-23"

account_id = "REPLACE_WITH_YOUR_CLOUDFLARE_ACCOUNT_ID"

# ----- Routes: which URLs on the zone invoke this Worker -----
# The app is mounted under ONE path via Next.js basePath, so this is just
# two entries: the app's public mount point, and its static-asset prefix
# (kept in sync with APP_PREFIXES in the worker script).
#
# IMPORTANT: the first pattern is scoped to /resources/ai-tool-directory
# specifically, NOT a bare /resources* — Webflow already serves other pages
# under /resources/ (e.g. /resources/reports for Industry Reports). A bare
# /resources* pattern would hijack those pages.
routes = [
  { pattern = "www.maximuslabs.ai/resources/ai-tool-directory*", zone_name = "maximuslabs.ai" },
  { pattern = "www.maximuslabs.ai/tools-static/*", zone_name = "maximuslabs.ai" },
]
