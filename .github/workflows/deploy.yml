name: Deploy to Vercel

# MANUAL fallback deploy only. Normal deploys run through Vercel's native Git
# integration, and the Vercel project's Root Directory is set to "tools-hub-app"
# (do not change it back to repo root, or native builds produce an empty site).
# Only run this workflow by hand if the Git integration is ever unavailable.
#
# Add these three repository secrets (Settings -> Secrets and variables -> Actions):
#   VERCEL_TOKEN        your Vercel access token
#   VERCEL_ORG_ID       your Vercel team/organization id
#   VERCEL_PROJECT_ID   the Vercel project id
#
# No env vars need to be configured in Vercel: the public Sanity config lives in
# tools-hub-app/.env.production, and the dataset is public (no token needed).

on:
  # Deploys are handled by Vercel's native Git integration, with the project's
  # Root Directory set to tools-hub-app. This workflow no longer runs on push
  # (that caused double deploys and hit the free-tier "api-upload-free" cap).
  # Kept for manual, on-demand runs only.
  workflow_dispatch:

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools-hub-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build with Vercel
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy prebuilt to production
        run: vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"
