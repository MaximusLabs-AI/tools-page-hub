name: Deploy to Vercel

# Deploys the Next.js app (in tools-hub-app/) to Vercel on every push to main.
#
# Add these three repository secrets (Settings -> Secrets and variables -> Actions):
#   VERCEL_TOKEN        your Vercel access token
#   VERCEL_ORG_ID       your Vercel team/organization id
#   VERCEL_PROJECT_ID   the Vercel project id
#
# In the Vercel project settings, set  Root Directory = tools-hub-app.
# No env vars need to be configured in Vercel: the public Sanity config is in
# tools-hub-app/.env.production, and the dataset is public (no token needed).

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build with Vercel
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy prebuilt to production
        run: vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"
